<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Retired app notice</title><style>body{font-family:sans-serif;margin:0} #map{position:relative;width:900px;height:520px;margin:10px} #map:focus,#map:focus-visible{outline:4px solid #c00;outline-offset:-4px} .ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:9} .ov .box{background:#fff;padding:24px;width:520px}</style></head><body>
<div class="ov jimu-widget-splash" id="ov"><div class="box"><h2>NOTICE</h2><p>This application has been retired and replaced.</p>
<a href="login_page.html" target="_self">NEW Explore County App</a><br>
<div role="checkbox" aria-checked="false" tabindex="0" id="c">Enter the retired application instead</div>
<button id="ok" disabled>OK</button></div></div>
<div>Layers: <input type="checkbox" class="lyr"> <input type="checkbox" class="lyr"> <input type="checkbox" class="lyr"></div>
<div id="map" class="maplibregl-map" tabindex="0" role="application" aria-label="Parcel and zoning map of the county"><canvas width="900" height="520"></canvas></div><script src="mockmap.js"></script><script>MockMap(document.getElementById("map"),{keyboard:true});function trap(box){document.addEventListener("keydown",e=>{if(e.key!=="Tab"||!document.body.contains(box))return;e.preventDefault();
const f=[...box.querySelectorAll("a[href],button,input,[tabindex]")].filter(x=>!x.disabled&&x.tabIndex>=0);if(!f.length)return;
const i=f.indexOf(document.activeElement);f[(i+(e.shiftKey?-1:1)+f.length)%f.length].focus();},true);}
const ov=document.getElementById("ov"), c=document.getElementById("c"), ok=document.getElementById("ok"); trap(ov);
c.addEventListener("keydown",e=>{if(e.key===" "){e.preventDefault();const on=c.getAttribute("aria-checked")!=="true";c.setAttribute("aria-checked",on);ok.disabled=!on;}});
ok.addEventListener("click",()=>ov.remove());
for (const l of document.querySelectorAll(".lyr")) l.addEventListener("change",()=>{location.href="login_page.html";});  // must never be ticked
</script></body></html>

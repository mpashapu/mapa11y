<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Viewer with five layer-error popups</title>
<style>body{font-family:sans-serif;margin:0} #map{position:relative;width:900px;height:520px;margin:10px} #map:focus-visible{outline:4px solid #c00;outline-offset:-4px}
.jimu-popup{position:fixed;inset:0;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;z-index:9}
.jimu-popup .box{background:#fff;padding:24px;width:520px}</style></head><body>
<h1>Public map</h1>
<div id="map" class="maplibregl-map" tabindex="0" role="application" aria-label="Parcel and zoning map of the county">
  <canvas width="900" height="520"></canvas></div>
<script src="mockmap.js"></script><script>
MockMap(document.getElementById("map"),{keyboard:true});
// Web AppBuilder style: one message box per layer that failed to load, stacked; the top one traps Tab
const stack = [];
for (const name of ["Parcels", "Zoning", "Flood zones", "Fire hydrants", "Address points"]) {
  const p = document.createElement("div"); p.className = "jimu-popup";
  p.innerHTML = '<div class="box"><p>The layer, ' + name + ', cannot be added to the map.</p>' +
                '<a href="#" class="more">More information</a> <div class="jimu-btn" role="button" tabindex="0">OK</div></div>';
  p.querySelector(".more").addEventListener("click", e => e.preventDefault());
  p.querySelector(".jimu-btn").addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); p.remove(); stack.splice(stack.indexOf(p), 1); } });
  document.body.appendChild(p); stack.push(p);
}
document.addEventListener("keydown", e => {
  if (e.key !== "Tab" || !stack.length) return;
  e.preventDefault();
  const f = [...stack[stack.length - 1].querySelectorAll("a[href],[tabindex]")];
  const i = f.indexOf(document.activeElement);
  f[(i + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus();
}, true);
</script></body></html>

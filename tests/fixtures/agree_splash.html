<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Viewer with terms splash</title>
<style>body{font-family:sans-serif;margin:0} #map{position:relative;width:900px;height:520px;margin:10px}
#map:focus-visible{outline:4px solid #c00;outline-offset:-4px}
.jimu-widget-splash{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:9}
.jimu-widget-splash .box{background:#fff;padding:24px;width:520px}</style></head>
<body>
<div class="jimu-widget-splash"><div class="box"><h2>GIS website disclaimer</h2><p>Maps are for information only.</p>
<div id="agree" role="checkbox" aria-checked="false" tabindex="0">I agree to the above terms and conditions</div>
<button id="ok" disabled>OK</button></div></div>
<h1>Public map</h1>
<div id="map" class="maplibregl-map" tabindex="0" role="application" aria-label="Public inquiry map of parcels and zoning">
  <canvas width="900" height="520"></canvas></div>
<script src="mockmap.js"></script><script>
MockMap(document.getElementById("map"),{keyboard:true});
const agree = document.getElementById("agree"), ok = document.getElementById("ok");
function toggle(){ const on = agree.getAttribute("aria-checked") !== "true"; agree.setAttribute("aria-checked", on); ok.disabled = !on; }
agree.addEventListener("keydown", e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); toggle(); } });
agree.addEventListener("click", toggle);
ok.addEventListener("click", () => document.querySelector(".jimu-widget-splash").remove());
</script></body></html>

<body><a href="#map">Skip to Map</a>

    <canvas width="900" height="520"></canvas>
    <div class="logo-med" tabindex="0" title="Esri">Esri</div>
  </div>
</div>
<script src="mockmap.js"></script><script>MockMap(document.getElementById("map"),{keyboard:true})</script>

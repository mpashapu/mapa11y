<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Web AppBuilder app that loads partly the first time</title><style>body{font-family:sans-serif;margin:0} #map{position:relative;width:900px;height:520px;margin:10px} #map:focus,#map:focus-visible{outline:4px solid #c00;outline-offset:-4px} .ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:9} .ov .box{background:#fff;padding:24px;width:520px}</style></head><body class="jimu-main-font">
<div id="main-page"><div id="jimu-layout-manager"><div id="bar"></div><div id="map" class="maplibregl-map" tabindex="0" role="application" aria-label="Parcel and zoning map of the county"><canvas width="900" height="520"></canvas></div></div></div>
<script>var jimuConfig = {loadingId: "main-loading", mainPageId: "main-page", layoutId: "jimu-layout-manager", mapId: "map"};</script>
<script src="mockmap.js"></script><script>MockMap(document.getElementById("map"),{keyboard:true});
if (sessionStorage.getItem("loadedOnce")) {     // second load: widgets come up
  document.getElementById("bar").innerHTML='<button class="jimu-widget">Legend</button><button class="jimu-widget">Layer List</button>';
} else { sessionStorage.setItem("loadedOnce", "1"); }   // first load: basemap only, no widgets
</script></body></html>
